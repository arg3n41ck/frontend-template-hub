name: publish-npm

on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run verify
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          test "cli-v$VERSION" = "$TAG"
      - run: npm pack --dry-run
      - name: Check whether this version tarball already exists
        id: registry
        run: |
          PACKAGE_NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"
          TARBALL_NAME="${PACKAGE_NAME##*/}-$VERSION.tgz"
          if curl --fail --silent --show-error --location --head --max-time 20 \
            "https://registry.npmjs.org/$PACKAGE_NAME/-/$TARBALL_NAME" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm with provenance
        if: steps.registry.outputs.published != 'true'
        run: npm publish --access public --provenance
