name: verify

on:
  push:
  pull_request:

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-registry.mjs
      - run: bash -n scripts/create-ruflo.sh
      - run: ./scripts/create-ruflo.sh --list
      - run: ./scripts/create-ruflo.sh demo --template react-vite --dry-run
