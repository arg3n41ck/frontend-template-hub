name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-registry.mjs
      - run: bash -n scripts/create-project.sh
      - run: node --test scripts/create-project.test.mjs
      - run: ./scripts/create-project.sh --list --json
      - run: ./scripts/create-project.sh demo --template react-vite --dry-run
