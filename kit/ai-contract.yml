name: AI contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .ai/context.mjs --check
      - run: node .ai/context.mjs --task question
      - run: node .ai/context.mjs --task ui --risk shared-ui --risk async
